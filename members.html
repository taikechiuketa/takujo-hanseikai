<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>入力メンバー｜卓上反省会</title><link rel="stylesheet" href="./sheet.css"><script defer src="./vendor/supabase-2.119.0.js"></script><script defer src="./members.js"></script></head><body><main>
<header class="brand-header"><div><h1 id="membersTitle">入力メンバー</h1><p>卓上反省会 ／ メンバー管理</p></div></header><p><a href="./account.html">← マイグループ</a>　<a id="membersPlay" hidden>対局を入力</a></p>
<p id="membersStatus" role="status" aria-live="polite">ログイン状態を確認しています…</p>
<section id="invitation" class="card" hidden><h2 id="inviteHeading">入力メンバーへの招待</h2><p>参加すると、このグループの対局結果・履歴・プレイヤーを入力・修正できます。グループ設定とメンバー管理は管理者だけが行えます。</p><p id="inviteLogin" hidden><a href="./account.html">ログイン・アカウント作成</a>をしてから、この招待リンクをもう一度開いてください。</p><button id="acceptInvite" hidden>入力メンバーとして参加する</button></section>
<section id="membersPanel" class="card" hidden><h2>登録メンバー</h2><p id="memberSummary"></p><ul id="membersList"></ul></section>
<section id="inviteControls" class="card" hidden><h2>入力メンバーを招待</h2><p>リンクは7日間有効・一人が参加すると使用済みになります。参加してほしい人だけに送ってください。成績の閲覧用リンクとは別です。</p><button id="createInvite">招待リンクを作成</button><div id="createdInvite" hidden><label>招待リンク<input id="inviteUrl" readonly type="text"></label><p id="inviteExpiry"></p><button id="copyInvite" class="secondary">招待リンクをコピー</button></div><p><button id="revokeInvites" class="secondary">未使用の招待リンクをすべて無効化</button></p></section>
<dialog id="removeMemberDialog"><form method="dialog"><h2>入力権限を解除</h2><p id="removeMemberPrompt"></p><p>これまでの対局成績は残ります。</p><button value="cancel" class="secondary">戻る</button><button id="confirmRemove" type="button">入力権限を解除する</button></form></dialog>
</main></body></html>
